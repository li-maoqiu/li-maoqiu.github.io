<h1>周边</h1>
我设计这些周边是出于自己的兴趣，并不是为了赚钱，所以我会将素材文件分享出来，大家可以自行下载、修改、联系店铺定制。<br>

<hr>
<div id="dy"></div>
<script>
    let d=[
        //[".","文字"], 直接显示文字(记得在前后加<br>)
        //["图片cj(.png)","标题","文字说明","链接(可留空)","额外介绍(可留空)"],

        ["19251003","不要杀死它 <small>盘子</small>","","/zb/19251006",""],
        // ["","","","/zb/",""],

        [".","<hr><a name='小像素点'></a><h3>小像素点</h3>"],
        ["19250852","梗图合集","","https://像素点.cn/梗图",""],
        ["19250796","仿主页 <small>透卡</small>","带小像素点出去玩~","/zb/19250740",""],
        ["19250956","安全出口 <small>壁纸 钥匙扣</small>","","/zb/19250935",""],
        // ["","","","/zb/",""],

        [".","<hr><a name='二创'></a><h3>二创 <small>（定制实物请遵守对应IP的相关规则）</small></h3>"],
        ["19251034","卡芙卡","","/zb/19251039",""],
        // ["","","","/zb/",""],
    ];
    let dy="";
    for(let i=0;d.length>i;i++){
        if(d[i][0]=="."){dy+=d[i][1]}
        else{
            if(d[i][0].indexOf(".")!=-1){}else{d[i][0]+=".jpg"}
            if(d[i][0].split(".")[0]<10000000){d[i][1]="<small>"+d[i][0].split(".")[0]+".</small><b>"+d[i][1]+"</b>";}
            else{d[i][1]="<b>"+d[i][1]+"</b>"}
            if(d[i][3]&&d[i][3]!=""){d[i][3]=["<a href='"+d[i][3]+"'>","</a>"]}else{d[i][3]=["",""]}
            if(d[i][4]&&d[i][4]!=""){d[i][4]="<span class='tsxt hs'>"+d[i][4]+"</span>"}else{d[i][4]=""}

            dy+="<div class='cj'>"+d[i][3][0]+"<img src='/x/周边/cj/"+d[i][0]+"'>"+d[i][1]+d[i][3][1]+"<br><span class='hs'>"+d[i][2]+"</span>"+d[i][4]+"</div>";
        }
    }
    document.getElementById("dy").innerHTML=dy;
</script>
