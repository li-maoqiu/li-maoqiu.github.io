“世界”通常指构成〈现世〉的一个个相对独立的空间，有些相互关联，庞大、主要的被称作“主世界”，附庸的为“小世界”，运行规则大多与主世界相同或相近。其他的称为“独立世界”。<br>
世界的中心是一枚〈星〉，一些世界里〈星〉周围会凝聚大地。<br>
〈真界〉里有〈星门〉连接不同世界，在〈现世〉传送到其他世界的原理也与此有关。<br>
世界毁灭时，星门会化作宝石坠落，被称作“坠星石”。<br>
