会〈黑魔法〉的女性。<br>
受宗教影响，一些文化里认为女巫是邪恶的，会使用残忍的手段对待他们认为的“女巫”。<br>
一些普通人在这样残忍的“女巫狩猎”里〈顿悟〉出黑魔法。<br>
（女巫狩猎制造女巫，但对他们来说就是：我们的仪式有用，能用来逼出女巫。）
