〈本地图片|18196077|50〉<br>
<br>

（设计中）<br>
〈死灵术〉士或〈女巫〉（也可以都是）。<br>
久失搭理的深灰色乱发，浓厚的黑眼圈，面色惨白，瘦骨嶙峋。<br>
在店里会披着黑色袍子，包裹全身。<br>
用布条在胸前缠了几圈，手上也缠着。<br>
身上纹着很大的符文。<br>
长裤、靴子（或者赤脚？）。<br>
腰间插着匕首。<br>
<br>

凭空幻化出镰刀的虚影。
